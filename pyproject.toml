[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frankenstein-control-plane"
version = "0.1.0"
description = "Registry-backed capability lifecycle for the Frankenstein agent"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3", "pydantic>=2.9,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
frankenstein = "frankenstein.cli:main"
frankenstein-mcp = "frankenstein.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/frankenstein"]

[tool.pytest.ini_options]
testpaths = ["tests"]
